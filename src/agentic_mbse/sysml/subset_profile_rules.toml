# ---- ES-010 omission ----------------------------------------------------------------------------

[[rule]]
id = "string-value-omission"
title = "String value dropped from generated output"
matrix_rows = ["ES-010"]
fact_requirements = ["string_value"]
remedy = "Keep String values as documentation; the generated catalog and contract carry numeric and Boolean values only. Do not bind a String to a calculation input (the ES-010 refusal side)."
semantic_limits = "Both spellings (an attribute declaration and the :>> redefinition shorthand) are dropped; no generator site raises, so the evidence is the generated output itself. The refusal side, a String value bound to a calculation input the generator projects, is a candidate (refused at projection) and this rule still reports it omitted."
doc_anchor = "generator-subset#string-value-omission"
evidence_status = "probe_observed"
example_probe = "string-value-omission__string_value__attribute_value__redefinition_shorthand"
generator_evidence = []  # an omission has no raise site

[[rule.shape]]
id = "string_value"
reason = "string_value_not_generated"

[[rule.shape.admission]]
context = "attribute_value"
outcome = "omitted"
evidence = [
    "probe:string-value-omission__string_value__attribute_value__attribute_declaration",
    "probe:string-value-omission__string_value__attribute_value__redefinition_shorthand",
]
