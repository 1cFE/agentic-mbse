# The executable-subset rule records (EXEC-SUBSET-CONTRACT Item 1).
#
# Each rule maps (shape, context) to an outcome. A pair with no admission is `unconfirmed`.
# Every admission cites evidence: `probe:<id>` is a retained run of the pinned generator under
# tests/fixtures/subset_profile/probes/<id>/; `corpus:<fixture>` is a snapshot fixture of the
# generator's accepted corpus, for `admitted` only. `SI_*` codes appear only in the evidence
# fields `expected_code` and `generator_evidence`.
#
# Loaded and validated by agentic_mbse.sysml.subset_profile.load_rule_records. Changing this
# file changes SUBSET_PROFILE_VERSION (tests/test_sysml/test_subset_profile_version.py).

schema = 1

[verified_against]
codegen_rev = "b5663c07e987a892e27d21e68cec40d0656574ee"
agentic_rev = "47614c266c96e2a2b1519116f931f059f6ca7554"
syside_version = "0.8.4"

# ---- ES-003, ES-012, self-binding ---------------------------------------------------------------

[[rule]]
id = "binding-source"
title = "Calculation or constraint input bound to a source the generator cannot wire"
matrix_rows = ["ES-003", "ES-012", "SELF-BINDING"]
fact_requirements = ["binding_source", "occurrence"]
remedy = "Bind the input to a literal or to one plain reference to a feature that holds the value; compute tuples and arithmetic in a named attribute and bind that."
semantic_limits = "Applies only where the generator classifies the binding: the consuming usage's owner is instantiated under a generator root or is a package, and a calculation usage is the selected writer in that scope. The input declaration itself is never refused."
doc_anchor = "generator-subset#binding-source"
evidence_status = "code_read_pending_item_2"

[[rule.generator_evidence]]
code = "SI_EXPRESSION_SOURCE_UNSUPPORTED"
site = "elaboration/elaborate.py:2130-2171 (_binding_evidence), :2188-2196"

[[rule.generator_evidence]]
code = "SI_SELF_BINDING"
site = "elaboration/elaborate.py:2188-2191; extraction/binding_source.py:87-89"

[[rule.shape]]
id = "expression_source"
reason = "binding_source_expression"
expected_code = "SI_EXPRESSION_SOURCE_UNSUPPORTED"

[[rule.shape]]
id = "self_reference_source"
reason = "binding_source_self_reference"
expected_code = "SI_SELF_BINDING"

# ---- ES-001 -------------------------------------------------------------------------------------

[[rule]]
id = "calc-owned-assertion"
title = "Constraint owned by a calculation"
matrix_rows = ["ES-001"]
fact_requirements = ["assertion_owner", "constraint"]
remedy = "Move the constraint to the part definition or part usage that owns the calculation, binding it to the calculation's inputs or result there."
semantic_limits = "Asserted forms are those the constraint extractor names asserted (definition_typed, inline, named_usage_reference). A calc-usage owner is outside the generator's owner-kind map for every form."
doc_anchor = "generator-subset#calc-owned-assertion"
evidence_status = "probe_observed"
example_probe = "calc-owned-assertion__non_asserted_constraint__calc_definition_owner"

[[rule.generator_evidence]]
code = "SI_CONSTRAINT_UNATTACHED"
site = "elaboration/elaborate.py:1625 (asserted, calc-def owner); :794-820 (calc-usage owner)"

[[rule.shape]]
id = "asserted_constraint"
reason = "calc_owned_asserted_constraint"
expected_code = "SI_CONSTRAINT_UNATTACHED"

[rule.shape.no_admitted_context]
citation = "elaboration/elaborate.py:1625 with graph.py:287-292 (a calc-def owner attaches nothing, and an asserted form then grades error); elaborate.py:794-820 (a calc-usage owner is outside the owner-kind map and raises)"
statement = "An asserted constraint is refused under both owners this rule recognizes; the same constraint owned by a part is a different shape (a control probe)."

[[rule.shape.admission]]
context = "calc_definition_owner"
outcome = "refused"
evidence = ["probe:calc-owned-assertion__asserted_constraint__calc_definition_owner"]

[[rule.shape.admission]]
context = "calc_usage_owner"
outcome = "refused"
evidence = ["probe:calc-owned-assertion__asserted_constraint__calc_usage_owner"]

[[rule.shape]]
id = "non_asserted_constraint"
reason = "calc_owned_non_asserted_constraint"
expected_code = "SI_CONSTRAINT_UNATTACHED"

[[rule.shape.admission]]
context = "calc_definition_owner"
outcome = "admitted"
evidence = ["probe:calc-owned-assertion__non_asserted_constraint__calc_definition_owner"]

[[rule.shape.admission]]
context = "calc_usage_owner"
outcome = "refused"
evidence = ["probe:calc-owned-assertion__non_asserted_constraint__calc_usage_owner"]

# ---- ES-006 -------------------------------------------------------------------------------------

[[rule]]
id = "conditional-expression"
title = "Conditional expression at an expression-inventory site"
matrix_rows = ["ES-006"]
fact_requirements = ["expression_site"]
remedy = "Compute each branch as its own attribute and select with arithmetic the subset supports, or move the choice into a calculation definition's bare result expression (a handwritten stub)."
semantic_limits = "Refusal-eligible only for a recognized `if` conditional whose reference walk fails with RESOLVED_TARGET_MISSING; the generator reports it with its generic evidence-gap code, so every probe also checks the error's location. Any other walk failure is unverified. A calculation definition whose result is a bare expression is refused for having no output whatever the expression holds, so that context stays unconfirmed; a calculation usage's bare result expression is never examined (admitted, and dropped from the output)."
doc_anchor = "generator-subset#conditional-expression"
evidence_status = "partial"
example_probe = "conditional-expression__conditional_unresolved_branch__other_expression_site"

[[rule.generator_evidence]]
code = "SI_EVIDENCE_INCOMPLETE"
site = "agentic_mbse reference_use.py (RESOLVED_TARGET_MISSING) via elaboration/expression_evidence.py:253-275; mapped at orchestration/elaborated_pipeline.py:425"

[[rule.shape]]
id = "conditional_resolved_branches"
reason = "conditional_expression_resolved_branches"

[[rule.shape]]
id = "conditional_unresolved_branch"
reason = "conditional_expression_unsupported"
expected_code = "SI_EVIDENCE_INCOMPLETE"

[[rule.shape.admission]]
context = "attribute_value"
outcome = "refused"
evidence = ["probe:conditional-expression__conditional_unresolved_branch__attribute_value"]

[[rule.shape.admission]]
context = "binding_value"
outcome = "refused"
evidence = ["probe:conditional-expression__conditional_unresolved_branch__binding_value"]

[[rule.shape.admission]]
context = "calc_definition_feature_value"
outcome = "refused"
evidence = ["probe:conditional-expression__conditional_unresolved_branch__calc_definition_feature_value"]

[[rule.shape.admission]]
context = "constraint_predicate"
outcome = "refused"
evidence = ["probe:conditional-expression__conditional_unresolved_branch__constraint_predicate"]

[[rule.shape.admission]]
context = "other_expression_site"
outcome = "admitted"
evidence = ["probe:conditional-expression__conditional_unresolved_branch__other_expression_site"]

# ---- ES-007 -------------------------------------------------------------------------------------

[[rule]]
id = "constraint-predicate"
title = "Constraint predicate the executable profile blocks or excludes"
matrix_rows = ["ES-007"]
fact_requirements = ["assertion_owner", "constraint", "occurrence"]
remedy = "Split Boolean data out of numerical assertions, or rewrite the predicate as a numerical comparison the profile admits; the finding's detail reasons name the profile's diagnosis."
semantic_limits = "The executable profile (executable_profile.py) decides eligibility; this rule only places its BLOCK and NON_NUMERICAL decisions by where the constraint's owner attaches. UNASSESSED is counted, never admitted."
doc_anchor = "generator-subset#constraint-predicate"
evidence_status = "code_read_pending_item_2"

