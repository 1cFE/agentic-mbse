fact_requirements = ["expression_site"]
remedy = "Name the element with its own feature and reference that feature instead of indexing a collection."
semantic_limits = "The expression inventory refuses an authored index model-wide, before any instantiation, wherever it walks a declared feature value or a constraint predicate. A calculation definition whose result is a bare expression is refused for having no output whatever the expression holds, so that context stays unconfirmed; a calculation usage's bare result expression is never examined (admitted, and dropped from the output)."
