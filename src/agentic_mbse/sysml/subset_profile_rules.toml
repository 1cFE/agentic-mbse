evidence = ["probe:invocation-callable__unsupported_callable__other_expression_site"]

# ---- ES-004 -------------------------------------------------------------------------------------

[[rule]]
id = "part-multiplicity"
title = "Part multiplicity the occurrence model cannot expand"
matrix_rows = ["ES-004"]
fact_requirements = ["occurrence", "part_multiplicity"]
remedy = "Give the part usage an exact literal multiplicity, unordered and unique, or remove the multiplicity; model a variable count as an attribute."
semantic_limits = "Only part usages the generator visits (generator roots and the composite part usages reachable from them) are expanded; the multiplicity is resolved per parent occurrence. Attribute usages and unvisited part usages are never expanded."
doc_anchor = "generator-subset#part-multiplicity"
evidence_status = "code_read_pending_item_2"

[[rule.generator_evidence]]
code = "SI_MULTIPLICITY_UNSUPPORTED"
site = "elaboration/occurrence.py:827 (ordered), :835 (nonunique), :894 (range), in _multiplicity_indices :812-899"

[[rule.generator_evidence]]
code = "SI_MULTIPLICITY_UNRESOLVED"
