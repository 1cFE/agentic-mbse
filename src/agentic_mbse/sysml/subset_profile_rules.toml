# ---- ES-005 -------------------------------------------------------------------------------------

[[rule]]
id = "invocation-callable"
title = "Invocation of a callable outside the executable subset"
matrix_rows = ["ES-005"]
fact_requirements = ["expression_site"]
remedy = "Write the computation with operators the subset supports (explicit multiplication, arithmetic min/max identities) or with NumericalFunctions::sum; or move it into a calculation definition's bare result expression (a handwritten stub)."
semantic_limits = "Callable identity is decided by the shared allowlist (invocation_allowlist.py, today only NumericalFunctions::sum), the same predicate the generator's inventory refuses through. Operators are not invocations. A calculation definition whose result is a bare expression is refused for having no output whatever the expression holds, so that context stays unconfirmed; a calculation usage's bare result expression is never examined (admitted, and dropped from the output)."
doc_anchor = "generator-subset#invocation-callable"
evidence_status = "probe_observed"
example_probe = "invocation-callable__unsupported_callable__other_expression_site"

[[rule.generator_evidence]]
code = "SI_EXPRESSION_SOURCE_UNSUPPORTED"
site = "agentic_mbse reference_use._require_supported_invocation, via elaboration/expression_evidence.py:253-275; mapped at orchestration/elaborated_pipeline.py:389-396"

[[rule.shape]]
id = "unsupported_callable"
reason = "invocation_callable_unsupported"
expected_code = "SI_EXPRESSION_SOURCE_UNSUPPORTED"

[[rule.shape.admission]]
context = "attribute_value"
outcome = "refused"
evidence = ["probe:invocation-callable__unsupported_callable__attribute_value", "probe:invocation-callable__unsupported_callable__attribute_value__max", "probe:invocation-callable__unsupported_callable__attribute_value__size"]

[[rule.shape.admission]]
context = "binding_value"
outcome = "refused"
evidence = ["probe:invocation-callable__unsupported_callable__binding_value"]

[[rule.shape.admission]]
context = "calc_definition_feature_value"
outcome = "refused"
evidence = ["probe:invocation-callable__unsupported_callable__calc_definition_feature_value"]

[[rule.shape.admission]]
