# Runtime adaptations: the closed list of body changes that make main's text work
# under both Claude Code and Codex (SC2, design D4 and Appendix A). Reviewed once.
#
# Semantics, implemented independently by `reconcile.py write` and `reconcile.py check`:
# - `file` is the path in the source tree after the path rule (claude/commands/<n>.md ->
#   skills/<n>/SKILL.md, claude/skills/<n>/** -> skills/<n>/**, claude/agents/<n>.md ->
#   agents/<n>.md; templates keep their paths).
# - An entry applies to the body only. The body is the text below the frontmatter when a
#   file starts with "---\n" (everything after the next line equal to "---"), otherwise the
#   whole file. Frontmatter is never adapted; the envelope alone governs it.
# - Entries apply in list order. `count` is the exact number of occurrences of `old` in the
#   body at the moment the entry applies. Every occurrence is replaced by `new`.
# - `origin` is `branch` (the native branch's own adaptation, copied verbatim) or `item1`
#   (added by this item). `review: true` marks an entry the one-time review must judge.

- id: A1
  file: skills/onboard/SKILL.md
  old: "**`CLAUDE.md`**"
  new: "**`modeling_project/OVERVIEW.md` and the current assistant’s entry file (`CLAUDE.md` or `AGENTS.md`)**"
  count: 1
  why: >-
    The installer's entry files point to OVERVIEW.md, so it is the one context file both
    runtimes read; CLAUDE.md alone is Claude's entry file. Called a content change by the
    spec review; kept as an adaptation by design.
  origin: branch
  review: true

