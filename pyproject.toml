[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-mbse"
version = "0.1.0"
description = "Domain-agnostic MBSE toolkit for AI-assisted systems engineering"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Reid", email = "westwood.reid@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "syside>=0.8.4",
    "pyyaml>=6.0",
    "ulid-py>=1.1.0",
    "click>=8.0",
    "mcp>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.scripts]
agentic-mbse = "agentic_mbse.cli:main"

[project.urls]
Homepage = "https://github.com/yourorg/agentic-mbse"
Repository = "https://github.com/yourorg/agentic-mbse"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_mbse", "src/comment_system"]

# Include claude/, docs/, and project_templates/ directories for CLI to access at runtime
[tool.hatch.build.targets.wheel.force-include]
"claude" = "agentic_mbse_data/claude"
"docs" = "agentic_mbse_data/docs"
"project_templates" = "agentic_mbse_data/project_templates"
"SOURCE_INDEX.md.template" = "agentic_mbse_data/SOURCE_INDEX.md.template"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "claude/",
    "docs/",
    "project_templates/",
    "SOURCE_INDEX.md.template",
    "tests/",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_mbse", "comment_system"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "syside.*"
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/agentic_mbse"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.uv]
extra-index-url = ["https://gitlab.com/api/v4/projects/69960816/packages/pypi/simple"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
