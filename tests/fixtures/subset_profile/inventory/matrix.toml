# Capability/refusal matrix (EXEC-SUBSET-CONTRACT Item 1, plan Phase 8).
#
# One row per named case. Each row has exactly one class, an owner, the contexts where its
# outcome holds, the evidence for that outcome, and the coverage it leaves. Shared-rule rows
# join the packaged rule records (agentic_mbse/sysml/subset_profile_rules.toml): their contexts
# are the record contexts with the row's outcome, and their evidence status is the rule's.
# `sites` holds site-account IDs (site_account.csv). `dc3` cross-references dc3 T-001 B1-B9
# (models at 808464d); `upstream` cross-references dc3 toolkit-upstream-findings U1-U7.
#
# Loaded by tests/helpers/subset_matrix.py; rendered to the item's evidence/matrix.md by
# scripts/subset_profile/render_matrix.py. Owner assignments for anything not implemented in
# Item 1 are where the case is tracked today; destinations are the R3 proposal's, owner-only.

schema = 1

# ---- shared rules ---------------------------------------------------------------------------

[[row]]
id = "ES-001"
title = "Constraint owned by a calc definition or a calc usage"
class = "shared_rule"
rule = "calc-owned-assertion"
shapes = ["asserted_constraint", "non_asserted_constraint"]
contexts = ["calc_definition_owner", "calc_usage_owner"]
outcome = "refused"
evidence_status = "probe_observed"
evidence = [
    "probe:calc-owned-assertion__asserted_constraint__calc_definition_owner",
    "probe:calc-owned-assertion__asserted_constraint__calc_usage_owner",
    "probe:calc-owned-assertion__non_asserted_constraint__calc_usage_owner",
    "probe:calc-owned-assertion__non_asserted_constraint__calc_definition_owner",
]
owner = "agentic-mbse, EXEC-SUBSET-CONTRACT Item 1"
coverage_limitation = ""
statement = "A non-asserted constraint owned by a calc def is admitted (graded, not refused). An asserted constraint is refused under every owner the rule computes, so it carries an SA-1 statement instead of an admitted-context probe. The part-owned assert stays admitted (control probe). Lifting the refusal is sysml-codegen [CALCDEF-GATE-IMPLEMENTATION]."
sites = []
no_raise_site = false
dc3 = ["B1"]
upstream = ["U1"]

