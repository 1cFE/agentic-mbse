    "case:conditional-expression__conditional_unresolved_branch__calc_definition_feature_value",
    "case:conditional-expression__conditional_unresolved_branch__other_expression_site",
]
owner = "agentic-mbse, EXEC-SUBSET-CONTRACT Item 1"
coverage_limitation = "A conditional whose branch references all resolve (`conditional_resolved_branches`) is unconfirmed in every context and recorded unobservable: the reference walk ends in RESOLVED_TARGET_MISSING for every `if` conditional, literal-only branches included, so no model reaches the shape (one case per context). `calc_result_expression` stays unconfirmed and is recorded unobservable (row CALC-DEF-BARE-RESULT). A refused conditional leaves `indexed-reference` unverified on the same site, because the shared reference walk is what fails; such a model reports verdict INCOMPLETE. A calc usage's bare result expression (`other_expression_site`) is omitted: never examined and dropped from the output (row CALC-USAGE-BARE-RESULT-DROP)."
statement = "The generator reports this with its generic evidence-gap code, so the rule refuses only a positively recognized conditional whose reference walk failed with RESOLVED_TARGET_MISSING. Any other evidence failure stays unverified."
sites = [
    "agentic_mbse/sysml/reference_use.py::_reference_use::shared-evidence::RESOLVED_TARGET_MISSING::1",
]
site_status = "listed"
dc3 = ["B6"]
upstream = ["U4"]

